<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Alter Ego Poster Select</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:ital,wght@0,500;0,600;0,700;0,800;0,900;1,800;1,900&display=swap">
<style>
/* Alter Ego character select, poster version: a vertical 1080x1920 stage (for vertical video).
   Layout of the first poster version (poster-v1.html): a ring on the right edge, two rows of cards fanned around
   its left side, the fighter bottom left in front. Colours and background of William's Nov 27 "Alter Egos" poster:
   black, a lime + pink grunge collage (rays, oval halftone, splash, swirls), black and lime silhouettes. */
@property --c { syntax: '<color>'; inherits: true; initial-value: #e8408f; }
:root{
  color-scheme: dark;
  --bg:#0a0a09; --ink:#0a0a09;
  --lime:#accb16; --lime2:#c4e31c; --lime3:#e2f08c; --olive:#4c5c15;
  --pink:#e8408f; --pink2:#ec73aa; --blush:#f7c6de; --cream:#fdf3f8;
  --title:'Audiowide','Exo 2',sans-serif;
  --hud:'Exo 2','Segoe UI',system-ui,sans-serif;
}
html,body{height:100%;margin:0;background:#000;overflow:hidden}
#viewport{position:fixed;inset:0;background:#000;overflow:hidden}
#viewport.nocursor,#viewport.nocursor *{cursor:none!important}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:50% 50%;overflow:hidden;background:var(--bg);color:var(--cream);font-family:var(--hud);user-select:none;-webkit-user-select:none;transition:--c .35s ease}
#shaker{position:absolute;inset:0}
.layer{position:absolute}

/* ---------- background ---------- */
#bgCanvas{left:0;top:0;width:1080px;height:1920px}
#glowHero{left:-300px;top:900px;width:1300px;height:1100px;background:radial-gradient(ellipse 36% 42% at 48% 50%,color-mix(in srgb,var(--c) 40%,transparent) 0%,color-mix(in srgb,var(--c) 12%,transparent) 52%,transparent 74%);pointer-events:none}
#glowRing{left:300px;top:0;width:1520px;height:1520px;background:radial-gradient(circle at 50% 50%,rgba(232,64,143,.25) 0%,rgba(196,227,28,.10) 36%,transparent 58%);pointer-events:none}
.spark{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;pointer-events:none;will-change:transform,opacity;animation:twinkle var(--t,3s) ease-in-out infinite;animation-delay:var(--d,0s);filter:drop-shadow(0 0 6px var(--sc,#c4e31c))}
.spark path{fill:var(--sc,#c4e31c)}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.55) rotate(0deg)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
#vines{left:0;top:0;width:1080px;height:1920px;pointer-events:none;filter:drop-shadow(0 0 6px rgba(196,227,28,.55))}

/* ---------- the ring (centre on the right edge) ---------- */
#hub{left:0;top:0;width:1080px;height:1920px;pointer-events:none}   /* stage-sized; the rings centre on --hx/--hy */
#hub > *{position:absolute;left:var(--hx);top:var(--hy);transform:translate(-50%,-50%);border-radius:50%}
.r-lines{width:1196px;height:1196px;border:3px solid rgba(172,203,22,.95);box-shadow:0 0 14px rgba(172,203,22,.55)}
.r-lines::after{content:"";position:absolute;inset:-18px;border-radius:50%;border:3px solid rgba(236,115,170,.9);box-shadow:0 0 14px rgba(232,64,143,.55)}
.r-band{width:690px;height:690px;filter:drop-shadow(0 0 16px rgba(196,227,28,.45)) drop-shadow(0 0 30px rgba(232,64,143,.4))}
.r-band i{position:absolute;inset:0;border-radius:50%}
.r-band .col{-webkit-mask:radial-gradient(circle,transparent 268px,#000 269px,#000 344px,transparent 345px);mask:radial-gradient(circle,transparent 268px,#000 269px,#000 344px,transparent 345px);
  background:radial-gradient(circle,transparent 268px,#ec73aa 269px,#f7c6de 276px,#e6f39a 284px,#c4e31c 316px,#dcef6a 334px,#f7c6de 340px,#e8408f 344px)}
.r-band .gloss{-webkit-mask:radial-gradient(circle,transparent 268px,#000 269px,#000 344px,transparent 345px);mask:radial-gradient(circle,transparent 268px,#000 269px,#000 344px,transparent 345px);background:linear-gradient(180deg,rgba(255,255,255,.65) 0%,rgba(255,255,255,.1) 40%,transparent 55%)}
.r-text{width:500px;height:500px;border-radius:0!important;animation:spinC 46s linear infinite reverse;will-change:transform}
.r-text svg{display:block;width:100%;height:100%;overflow:visible}
.r-text text{font:400 23px var(--title);letter-spacing:5px;fill:var(--lime3);transition:fill .2s}
#stage.rand .r-text text{fill:#f08cbd}
.r-inner{width:440px;height:440px;filter:drop-shadow(0 0 18px rgba(232,64,143,.7)) drop-shadow(0 0 40px rgba(196,227,28,.3))}
.r-inner i{position:absolute;inset:0;border-radius:50%;-webkit-mask:radial-gradient(circle,transparent 160px,#000 161px,#000 218px,transparent 219px);mask:radial-gradient(circle,transparent 160px,#000 161px,#000 218px,transparent 219px)}
.r-inner .col{background:conic-gradient(from 15deg,#e8408f 0deg,#ec73aa 60deg,#f7c6de 110deg,#eef79e 170deg,#c4e31c 215deg,#dcef6a 250deg,#f4bfd8 300deg,#e8408f 360deg)}
.r-inner .hl{background:radial-gradient(circle,transparent 175px,rgba(255,255,255,.85) 189px,transparent 205px)}
.r-core{width:322px;height:322px;background:radial-gradient(circle at 50% 40%,#2a2a28 0%,#121211 60%,#050505 100%);box-shadow:inset 0 10px 30px rgba(0,0,0,.6),0 0 0 6px rgba(5,5,5,.9);overflow:hidden}
.r-core::before{content:"";position:absolute;inset:0;border-radius:50%;background-image:radial-gradient(circle,rgba(172,203,22,.42) 1.5px,transparent 2px);background-size:10px 10px}
.r-core .spk{position:absolute;left:0;top:0;width:100%;height:100%;will-change:transform}   /* the speaker (speaker.js), under the "?" */
.r-core .spk.shine{opacity:0;will-change:opacity}
.r-core .spk.frame{will-change:auto}
.r-core .rnd{position:absolute;inset:0;will-change:transform}
.r-core .q{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font:400 116px/1 var(--title);background:linear-gradient(180deg,#ffffff 0%,#f1f9c0 45%,#c4e31c 55%,#accb16 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 1.5px #000) drop-shadow(0 3px 0 #000) drop-shadow(0 0 10px rgba(196,227,28,.7))}
.r-core .lbl{position:absolute;left:0;right:0;top:77%;text-align:center;font:800 18px/1 var(--hud);letter-spacing:6px;padding-left:6px;color:var(--lime3);text-shadow:0 0 6px #000,0 0 3px #000,0 1px 0 #000}
.r-pulse{width:440px;height:440px;opacity:0;will-change:opacity;box-shadow:0 0 48px 14px rgba(232,64,143,.9),inset 0 0 28px 8px rgba(232,64,143,.65)}   /* the pink ring's flare on each hit */
#stage.rand .r-core{box-shadow:inset 0 10px 30px rgba(0,0,0,.6),0 0 0 6px rgba(5,5,5,.9),0 0 50px rgba(232,64,143,.85)}
#stage.rand .r-core .q{background:linear-gradient(180deg,#ffffff 0%,#f7c6de 45%,#ec73aa 55%,#e8408f 100%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 1.5px #000) drop-shadow(0 3px 0 #000) drop-shadow(0 0 14px rgba(232,64,143,.9));animation:flick .16s steps(2,end) infinite}
.hubhit{width:440px;height:440px;pointer-events:auto;cursor:pointer}
@keyframes spinC{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes flick{50%{opacity:.55}}

/* ---------- cards: two rows fanned around the ring ---------- */
#cards{left:0;top:0;width:1080px;height:1920px;pointer-events:none;z-index:10}  /* own stacking layer: a raised card can't pass the fighter */
.card{position:absolute;left:0;top:0;width:var(--w);height:var(--h);margin:calc(var(--h) / -2) 0 0 calc(var(--w) / -2);pointer-events:auto;cursor:pointer;
  transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(var(--s,1));transition:transform .16s cubic-bezier(.25,.9,.3,1),opacity .3s ease;will-change:transform;
  filter:drop-shadow(0 0 2px rgba(255,255,255,.7)) drop-shadow(0 0 9px var(--g))}
.card .in{position:absolute;inset:0}
.card .face{position:absolute;inset:0;border-radius:6px;overflow:hidden;background:#fff;box-shadow:inset 0 0 0 3px var(--pink2)}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;-webkit-user-drag:none}
.card img.picked{opacity:0}
.card.on img.picked{opacity:1}
.card.on img.row{opacity:0}
.card .gloss{position:absolute;inset:0;border-radius:6px;background:linear-gradient(180deg,rgba(255,255,255,.42) 0%,rgba(255,255,255,.08) 42%,transparent 43%);pointer-events:none}
.card .badge{position:absolute;left:-14px;top:-16px;padding:5px 11px 3px;border-radius:999px;font:900 italic 21px/1 var(--hud);color:#fff;background:linear-gradient(180deg,#f190c0 0%,#e8408f 48%,#c42a74 52%,#ee5aa0 100%);box-shadow:0 0 0 2px #fff,0 0 14px rgba(232,64,143,.9);opacity:0;transform:scale(.6) rotate(calc(var(--r) * -1));transition:opacity .15s,transform .2s cubic-bezier(.25,1.6,.4,1)}
.card.on{--s:1.12;z-index:40;filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 22px var(--c))}
.card.on .face{background:linear-gradient(172deg,#ffffff 0%,color-mix(in srgb,var(--c) 28%,#fff) 60%,color-mix(in srgb,var(--c) 70%,#fff) 100%)}
.card.on .badge{opacity:1;transform:scale(1) rotate(calc(var(--r) * -1))}
#stage.roulette .card,#stage.roulette .card .badge{transition-duration:.05s}
#stage.locked .card:not(.on){opacity:.35;filter:grayscale(1) brightness(.7)}

/* ---------- READY band ---------- */
#band{left:0;top:1360px;width:1080px;height:200px;pointer-events:none;visibility:hidden;z-index:20}
#band .bg{position:absolute;inset:0;transform:scaleY(0);transition:transform .2s cubic-bezier(.2,.9,.3,1);
  background:linear-gradient(180deg,rgba(255,255,255,.45) 0%,rgba(255,255,255,.08) 48%,transparent 49%),linear-gradient(90deg,rgba(150,24,84,.88) 0,#e8408f 55%,rgba(150,24,84,.94) 100%);
  border-top:3px solid var(--lime2);border-bottom:3px solid var(--lime2);box-shadow:0 0 50px rgba(232,64,143,.55),0 0 24px rgba(196,227,28,.35)}
#band .bg::after{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.22) 1.5px,transparent 2px);background-size:10px 10px}
#band .txt{position:absolute;left:720px;top:24px;transform:translateX(-50%) skewX(-10deg);font:400 128px/1 var(--title);letter-spacing:12px;white-space:nowrap;display:flex}
#band .txt span{display:inline-block;background:linear-gradient(180deg,#ffffff 0%,#ffffff 40%,#f3f9c8 52%,#c4e31c 60%,#ffffff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 1px #5e0f33) drop-shadow(4px 5px 0 #6e1440) drop-shadow(0 0 18px rgba(196,227,28,.6));opacity:0;transform:translateX(140px)}
#band .sub{position:absolute;left:720px;bottom:14px;transform:translateX(-50%);font:800 26px/1 var(--hud);letter-spacing:9px;color:#fff;white-space:nowrap;opacity:0;text-shadow:0 2px 0 #6e1440}
#band .shine{position:absolute;inset:0;background:linear-gradient(100deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);background-size:300% 100%;background-position:120% 0;opacity:0}
#stage.locked #band{visibility:visible}
#stage.locked #band .bg{transform:scaleY(1)}
#stage.locked #band .txt span{animation:letterIn .36s cubic-bezier(.2,.9,.3,1) forwards;animation-delay:calc(var(--i) * 45ms + 120ms)}
#stage.locked #band .sub{animation:appear .3s .5s forwards}
#stage.locked #band .shine{animation:shine .7s .55s ease-out forwards}
@keyframes letterIn{to{opacity:1;transform:none}}
@keyframes appear{from{opacity:0}to{opacity:1}}
@keyframes shine{0%{opacity:1;background-position:120% 0}100%{opacity:1;background-position:-20% 0}}

/* ---------- the fighter (bottom left, in front of the fan) ---------- */
#hero,#heroBack{left:0;top:0;width:1080px;height:1920px;pointer-events:none}
#hero{z-index:30}
#titleBlock,#nameplate,#hints{z-index:40}
#heroNum{position:absolute;left:40px;top:860px;font:400 260px/1 var(--title);color:transparent;-webkit-text-stroke:2px color-mix(in srgb,var(--c) 80%,#fff);opacity:.22;letter-spacing:-4px}
#spot{left:90px;top:1800px;width:480px;height:90px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--c) 70%,#fff) 0%,color-mix(in srgb,var(--c) 40%,transparent) 45%,transparent 100%);opacity:.75;filter:blur(2px)}
#fig{left:0;top:0;width:1080px;height:1920px;transform-origin:330px 1850px;filter:drop-shadow(0 0 2px rgba(255,255,255,.95)) drop-shadow(0 0 18px var(--c))}
#fig .fm{position:absolute;display:block;opacity:0;object-fit:fill;pointer-events:none}
#randImg{position:absolute;opacity:0;filter:grayscale(1) brightness(.45) contrast(1.4)}
#hero .q{position:absolute;left:20px;top:1000px;width:640px;text-align:center;font:400 560px/1 var(--title);color:transparent;-webkit-text-stroke:3px rgba(236,115,170,.35);display:none}
#hero.rand .q{display:block;animation:flick2 .16s steps(2,end) infinite}
#hero.rand #randImg{opacity:1}
@keyframes flick2{50%{opacity:.4;transform:translateX(6px)}}

/* ---------- title + HUD ---------- */
#titleBlock{left:54px;top:54px;pointer-events:none}
#titleBlock h1{margin:0;font:400 120px/.9 var(--title);letter-spacing:4px;background:linear-gradient(180deg,#ffffff 0%,#ffffff 42%,#f3f9c8 50%,#c4e31c 62%,#accb16 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 1px #000) drop-shadow(4px 5px 0 #000) drop-shadow(0 0 22px rgba(232,64,143,.65))}
#titleBlock .pills{display:flex;gap:14px;margin-top:22px}
.pill{display:inline-block;border-radius:999px;padding:11px 20px 9px;font:900 italic 25px/1 var(--hud);letter-spacing:4px;box-shadow:0 0 0 2px #fff,0 0 16px rgba(232,64,143,.6)}
.pill.lime{color:var(--ink);background:linear-gradient(180deg,#ffffff 0%,#f8fbe0 48%,#dcef7a 52%,#c4e31c 100%)}
.pill.pink{color:#fff;background:linear-gradient(180deg,#f190c0 0%,#e8408f 48%,#c42a74 52%,#ee5aa0 100%)}
#nameplate{left:54px;bottom:64px;display:flex;flex-direction:column;gap:6px;pointer-events:none;isolation:isolate}
#nameplate::before{content:"";position:absolute;z-index:-1;left:-54px;right:-240px;top:-34px;bottom:-40px;background:linear-gradient(90deg,rgba(8,8,7,.88),rgba(8,8,7,.52) 60%,transparent)}
#np-epi{display:flex;gap:16px;align-items:baseline;font:800 28px/1 var(--hud);letter-spacing:8px;text-transform:uppercase;color:color-mix(in srgb,var(--c) 85%,#fff);text-shadow:0 0 12px color-mix(in srgb,var(--c) 75%,transparent),0 2px 0 #000}
#np-epi i{font-style:normal;color:#fff;opacity:.8}
#np-name{font:900 italic 118px/1.02 var(--hud);white-space:nowrap;padding:0 44px 6px 4px;margin-right:-44px;letter-spacing:2px;transform:skewX(-6deg);transform-origin:0 100%;
  background:linear-gradient(180deg,#ffffff 0%,#ffffff 38%,color-mix(in srgb,var(--c) 30%,#fff) 50%,color-mix(in srgb,var(--c) 85%,#fff) 74%,#ffffff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 1px #000) drop-shadow(3px 4px 0 #000) drop-shadow(0 0 20px color-mix(in srgb,var(--c) 75%,transparent))}
#np-rule{height:5px;width:640px;border-radius:3px;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 40%,#fff) 40%,transparent);box-shadow:0 0 12px var(--c)}
#hints{right:40px;bottom:26px;display:flex;gap:18px;font:700 18px/1 var(--hud);letter-spacing:2px;color:var(--lime3);transition:opacity .3s}
#hints kbd{display:inline-block;font:800 15px/1 var(--hud);padding:5px 8px 3px;margin-right:6px;color:var(--ink);border-radius:6px;background:linear-gradient(180deg,#ffffff 0%,#f8fbe0 45%,#dcef7a 55%,#c4e31c 100%)}
#stage.nohints #hints{opacity:0}
#flash{z-index:50;left:0;top:0;width:1080px;height:1920px;background:radial-gradient(circle at 35% 70%,#fff 0%,#f7c6de 45%,#ec73aa 100%);opacity:0;pointer-events:none}

/* ---------- intro (R replays) ---------- */
@keyframes fadeIn{from{opacity:0}}
@keyframes hubIn{from{opacity:0;transform:rotate(-30deg) scale(.85)}}
@keyframes cardIn{from{opacity:0;transform:scale(.3) rotate(-40deg)}}
@keyframes dropIn{from{opacity:0;transform:translateY(-60px)}}
@keyframes heroIn{from{opacity:0;transform:translateX(-140px)}}
@keyframes wipeIn{from{clip-path:inset(-80px calc(100% + 80px) -80px -80px)}to{clip-path:inset(-80px -260px -80px -80px)}}
#stage.intro #bgCanvas{animation:fadeIn .5s both}
#stage.intro #hub{animation:hubIn 1s cubic-bezier(.2,.85,.25,1) both;transform-origin:var(--hx) var(--hy)}
#stage.intro .card .in{animation:cardIn .42s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(var(--k) * 45ms + .45s)}
#stage.intro #titleBlock{animation:dropIn .6s .2s cubic-bezier(.2,.9,.3,1) both}
#stage.intro #hero,#stage.intro #heroBack{animation:heroIn .7s .8s cubic-bezier(.2,.9,.3,1) both}
#stage.intro #nameplate{animation:wipeIn .5s 1.1s both}
@media (prefers-reduced-motion: reduce){
  .r-text,.spark{animation:none!important}
  #stage.intro *{animation-duration:.01s!important;animation-delay:0s!important}
}
</style>
</head>
<body>
<div id="viewport">
<div id="stage" class="intro">
<div id="shaker">
  <canvas id="bgCanvas" class="layer" width="1620" height="2880"></canvas>
  <div id="glowRing" class="layer"></div>
  <div id="glowHero" class="layer"></div>
  <div id="sparks" class="layer" style="inset:0;pointer-events:none"></div>

  <div id="heroBack" class="layer"><div id="heroNum">01</div><div id="spot" class="layer"></div></div>

  <div id="hub" class="layer">
    <div class="r-lines"></div>
    <div class="r-band"><i class="col"></i><i class="gloss"></i></div>
    <div class="r-text"><svg viewBox="-250 -250 500 500"><defs><path id="txtRing" d="M -238 0 A 238 238 0 1 1 238 0 A 238 238 0 1 1 -238 0"/></defs><text><textPath id="txtRingPath" href="#txtRing" lengthAdjust="spacing"></textPath></text></svg></div>
    <div class="r-inner"><i class="col"></i><i class="hl"></i></div>
    <div class="r-pulse"></div>
    <div class="r-core"><div class="rnd"><span class="q">?</span><span class="lbl" id="randLabel"></span></div></div>
    <div class="hubhit"></div>
  </div>

  <svg id="vines" class="layer" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
  <div id="cards" class="layer"></div>

  <div id="band" class="layer"><div class="bg"></div><div class="shine"></div><div class="txt"></div><div class="sub"></div></div>

  <div id="hero" class="layer">
    <div id="fig" class="layer"><img id="randImg" alt=""></div>
    <div class="q">?</div>
  </div>

  <div id="titleBlock" class="layer"><h1 id="gameTitle"></h1><div class="pills"><span class="pill lime" id="selLabel"></span><span class="pill pink" id="ptag"></span></div></div>
  <div id="nameplate" class="layer">
    <div id="np-epi"><i id="np-no"></i><span id="np-epithet"></span></div>
    <div id="np-name"></div>
    <div id="np-rule"></div>
  </div>
  <div id="hints" class="layer"><span><kbd>&larr;&rarr;&uarr;&darr;</kbd>MOVE</span><span><kbd>ENTER</kbd>SELECT</span><span><kbd>ESC</kbd>BACK</span></div>
  <div id="flash" class="layer"></div>
</div>
</div>
</div>

<script src="media/roster.js"></script>
<script src="speaker.js"></script>
<script>
/* =====================================================================
   EDIT HERE. The fighters (order, videos, sizes, colours) come from media/roster.js.
   ===================================================================== */
const CONFIG = {
  gameTitle:   'ALTER<br>EGO',
  selectLabel: 'CHARACTER SELECT',
  playerLabel: 'PLAYER 1',
  readyText:   'READY',
  randomName:  'RANDOM',
  randomTag:   'Fate decides',
  epithet:     'Alter Ego',
  startWith:   0,
  showHints:   false,           // H shows them (off: this version is for recording vertical video)
  floorX: 330, floorY: 1852,    // the fighter's feet, stage px
  figScale: 1.18,               // the fighter is drawn this much bigger than in the landscape version
  lyingX: 500, lyingLift: 330,  // a lying fighter (Nujum): centre x and how far above the floor
  ring: { x: 905, y: 800 },     // the ring's centre (its outer rings run off the right edge, like the poster; x ≤ 919 keeps the speaker whole)
  inner: { r: 462, w: 176, h: 232, tilt: 30 },   // black silhouettes, just outside the pale band
  outer: { r: 724, w: 150, h: 198, tilt: 40 },   // lime silhouettes, outside the ring lines
  arc: [256, 106],              // the fan runs from this angle to that one (degrees, 180 = left)
  hoverDelay: 60,               // ms the pointer rests on a card before it's picked (sweeping across doesn't flicker)
  // roster.js has the green poster's glow colours; this page swaps them for the Alter Egos poster's limes and pinks
  recolour: { '#ff2e93': '#e8408f', '#f93193': '#f0509e', '#ff7ac1': '#ec73aa', '#8bf26f': '#c4e31c', '#d7ff3c': '#d8f03a', '#19bf73': '#accb16' },
  fighters: {},
};
/* ===================================================================== */

(() => {
const $ = s => document.querySelector(s);
const D2R = Math.PI / 180;
const MEDIA = window.ALTER_EGO_MEDIA;
if (!MEDIA || !MEDIA.fighters || !MEDIA.fighters.length) {
  document.body.insertAdjacentHTML('beforeend', '<p style="position:fixed;left:24px;top:24px;color:#fff;font:16px system-ui">media/roster.js is missing. Run tools/build_media.py.</p>');
  return;
}
const STORE = MEDIA.store;

  shaker.animate([{ transform: 'translate(0,0)' }, { transform: 'translate(-12px,7px)' }, { transform: 'translate(10px,-6px)' }, { transform: 'translate(-7px,4px)' }, { transform: 'translate(4px,-2px)' }, { transform: 'translate(0,0)' }], { duration: 340, easing: 'ease-out' });
  fig.animate([{ transform: 'scale(1.06)' }, { transform: 'scale(1)' }], { duration: 380, easing: 'cubic-bezier(.2,.9,.3,1)' });
  cardEls[k].animate([{ filter: 'brightness(2)' }, { filter: 'brightness(1)' }], { duration: 500 });
}
function cancel() {
  if (!locked) return;
  locked = false;
  stage.classList.remove('locked');
  badgeEls.forEach(b => b.textContent = '1P');
  if (cur !== RANDOM && cur !== null) backToIdle(cur);
}
function confirmSel() {
  if (locked || busy || cur === null) return;
  if (cur === RANDOM) roulette(); else lock(cur);
}
function roulette() {
  busy = true;
  stage.classList.add('roulette');
  clearInterval(randTimer);
  const target = (Math.random() * N) | 0;
  let idx = (Math.random() * N) | 0;
  const path = [];
  for (;;) { idx = (idx + 1) % N; path.push(idx); if (path.length >= N && idx === target) break; }
  let t = 0;
  path.forEach((s, j) => { const p = j / (path.length - 1); t += 30 + 170 * p * p * p; setTimeout(() => select(s, 'fast'), t); });
  setTimeout(() => { busy = false; stage.classList.remove('roulette'); lock(target); }, t + 300);
}

/* ---------------- input ---------------- */
let hoverT = null;
cardEls.forEach((el, k) => {
  el.addEventListener('pointerenter', () => { clearTimeout(hoverT); hoverT = setTimeout(() => { if (!locked && !busy) select(k); }, CONFIG.hoverDelay); });
  el.addEventListener('pointerleave', () => clearTimeout(hoverT));
  el.addEventListener('click', () => { clearTimeout(hoverT); if (locked || busy) return; select(k); confirmSel(); });
});
const hubHit = $('.hubhit');
hubHit.addEventListener('pointerenter', () => { clearTimeout(hoverT); if (!locked && !busy) select(RANDOM); });
hubHit.addEventListener('click', () => { if (locked || busy) return; select(RANDOM); confirmSel(); });
stage.addEventListener('contextmenu', e => { e.preventDefault(); cancel(); });
const DIRS = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
addEventListener('keydown', e => {
  const k = e.key;
  if (DIRS[k]) { e.preventDefault(); nav(...DIRS[k]); return; }
  if (k === 'Enter' || k === ' ' || k === 'z' || k === 'Z') { e.preventDefault(); if (!e.repeat) confirmSel(); return; }
  if (k === 'Escape' || k === 'Backspace' || k === 'x' || k === 'X') { e.preventDefault(); cancel(); return; }
  if (e.repeat) return;
  if (k === 'h' || k === 'H') stage.classList.toggle('nohints');
  else if (k === 'r' || k === 'R') replay();
  else if (k === 'f' || k === 'F') {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else document.documentElement.requestFullscreen?.().catch(() => {});
  }
});
const vp = $('#viewport');
let idleT;
addEventListener('pointermove', () => { vp.classList.remove('nocursor'); clearTimeout(idleT); idleT = setTimeout(() => vp.classList.add('nocursor'), 1500); });
function replay() {
  if (busy) return;
  cancel();
  stage.classList.remove('intro'); void stage.offsetWidth; stage.classList.add('intro');
}

/* ---------------- scale to window (portrait stage) ---------------- */
function fit() {
  const s = Math.min(vp.clientWidth / 1080, vp.clientHeight / 1920);
  stage.style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener('resize', fit);
fit();

const q = new URLSearchParams(location.search).get('start');
let start = CONFIG.startWith | 0;
if (q) start = isNaN(+q) ? ROSTER.findIndex(f => f.name.toLowerCase() === q.toLowerCase()) : +q - 1;
select(Math.min(Math.max(start, 0), N - 1), 'none');
document.fonts && document.fonts.ready.then(fitName);
ROSTER.forEach((_, k) => setTimeout(() => mediaFor(k), 1600 + k * 300));
window.ALTER_EGO = { select, lock, cancel, roster: ROSTER, ext: EXT };
})();
</script>
