<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Alter Ego Character Select</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:ital,wght@0,500;0,600;0,700;0,800;0,900;1,800;1,900&display=swap">
<style>
/* Alter Ego character select. A fixed 1920x1080 stage scaled to the window: the fighter on the left,
   a fan of cards around a glowing ring on the right, Frutiger Metro gloss (layout of the first version, index-v1.html).
   Colours and background of William's Nov 27 "Alter Egos" poster: black, a lime + pink grunge collage
   (rays, oval halftone, splash, swirls), black silhouettes on pink-edged white cards. */
@property --c { syntax: '<color>'; inherits: true; initial-value: #e8408f; }
:root{
  color-scheme: dark;
  --bg:#0a0a09; --deep:#050505; --ink:#0a0a09;
  --lime:#accb16; --lime2:#c4e31c; --lime3:#e2f08c; --chart:#c4e31c;
  --pink:#e8408f; --pink2:#ec73aa; --blush:#f7c6de; --cream:#fdf3f8;
  --title:'Audiowide','Exo 2',sans-serif;
  --hud:'Exo 2','Segoe UI',system-ui,sans-serif;
}
html,body{height:100%;margin:0;background:#000;overflow:hidden}
#viewport{position:fixed;inset:0;background:#000;overflow:hidden}
#viewport.nocursor,#viewport.nocursor *{cursor:none!important}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:50% 50%;overflow:hidden;background:var(--bg);color:var(--cream);font-family:var(--hud);user-select:none;-webkit-user-select:none;transition:--c .35s ease}
#shaker{position:absolute;inset:0}
.layer{position:absolute}

/* ---------- background: canvas (the Alter Egos poster's collage) + glows + sparkles ---------- */
#bgCanvas{left:0;top:0;width:1920px;height:1080px}
#glowHero{left:-200px;top:40px;width:1300px;height:1100px;background:radial-gradient(ellipse 34% 40% at 52% 52%,color-mix(in srgb,var(--c) 42%,transparent) 0%,color-mix(in srgb,var(--c) 12%,transparent) 50%,transparent 72%);pointer-events:none}
#glowRing{left:760px;top:0;width:1160px;height:1150px;background:radial-gradient(circle at 49% 50%,rgba(232,64,143,.28) 0%,rgba(196,227,28,.10) 40%,transparent 62%);pointer-events:none}
.spark{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;pointer-events:none;animation:twinkle var(--t,3s) ease-in-out infinite;animation-delay:var(--d,0s)}
.spark path{fill:var(--sc,#c4e31c)}
.spark{filter:drop-shadow(0 0 6px var(--sc,#c4e31c))}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.55) rotate(0deg)}50%{opacity:1;transform:scale(1) rotate(45deg)}}

/* ---------- ring hub (right) ---------- */
#hub{left:790px;top:35px;width:1080px;height:1080px;pointer-events:none}
#hub > *{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%}
.r-outer{width:960px;height:960px;border:2px solid rgba(172,203,22,.85);box-shadow:0 0 18px rgba(172,203,22,.5),inset 0 0 22px rgba(172,203,22,.25)}
.r-dash{width:1010px;height:1010px;border-radius:0!important}
.r-dash svg,.r-text svg{display:block;width:100%;height:100%;overflow:visible}
.r-dash{animation:spinC 110s linear infinite}
.r-pastel{width:600px;height:600px;filter:drop-shadow(0 0 14px rgba(196,227,28,.5)) drop-shadow(0 0 34px rgba(232,64,143,.38))}
.r-pastel i{position:absolute;inset:0;border-radius:50%;-webkit-mask:radial-gradient(circle,transparent 254px,#000 255px,#000 299px,transparent 300px);mask:radial-gradient(circle,transparent 254px,#000 255px,#000 299px,transparent 300px)}
.r-pastel .col{background:conic-gradient(from 210deg,#c4e31c,#b4d41a,#accb16,#dcef6a,#f7c6de,#ec73aa,#f190c0,#f9d3e5,#eef79e,#c4e31c)}
.r-pastel .gloss{background:linear-gradient(180deg,rgba(255,255,255,.75) 0%,rgba(255,255,255,.15) 38%,transparent 52%,rgba(10,10,9,.25) 100%)}
.r-pastel .rim{-webkit-mask:radial-gradient(circle,transparent 296px,#000 297px,#000 299px,transparent 300px);mask:radial-gradient(circle,transparent 296px,#000 297px,#000 299px,transparent 300px);background:#fff;opacity:.8}
.r-text{width:500px;height:500px;border-radius:0!important;animation:spinC 46s linear infinite reverse}
.r-text text{font:400 25px var(--title);letter-spacing:5px;fill:var(--lime3);transition:fill .2s}
#stage.rand .r-text text{fill:#f08cbd}
.r-inner{width:356px;height:356px;filter:drop-shadow(0 0 16px rgba(232,64,143,.75)) drop-shadow(0 0 40px rgba(232,64,143,.35))}
.r-inner i{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle closest-side,transparent 71%,#c4e31c 72%,#eef79e 77%,#ffffff 83%,#f7c6de 89%,#ec73aa 94%,#e8408f 98.5%,transparent 99.5%)}
.r-inner b{position:absolute;inset:0;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.55),transparent 45%);-webkit-mask:radial-gradient(circle closest-side,transparent 71%,#000 72%,#000 98%,transparent 99%);mask:radial-gradient(circle closest-side,transparent 71%,#000 72%,#000 98%,transparent 99%)}
.r-core{width:256px;height:256px;background:radial-gradient(circle at 50% 38%,#2a2a28 0%,#121211 58%,#050505 100%);box-shadow:inset 0 0 0 3px rgba(196,227,28,.55),inset 0 10px 30px rgba(0,0,0,.6),0 0 0 6px rgba(5,5,5,.9);overflow:hidden}
.r-core::before{content:"";position:absolute;inset:0;border-radius:50%;background-image:radial-gradient(circle,rgba(172,203,22,.45) 1.4px,transparent 1.9px);background-size:9px 9px;-webkit-mask:radial-gradient(circle at 50% 70%,#000 0%,transparent 70%);mask:radial-gradient(circle at 50% 70%,#000 0%,transparent 70%)}
.r-core::after{content:"";position:absolute;left:12%;top:6%;width:76%;height:42%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,0))}
.r-core .q{position:absolute;left:0;right:0;top:44px;text-align:center;font:400 118px/1 var(--title);background:linear-gradient(180deg,#ffffff 0%,#f1f9c0 45%,#c4e31c 55%,#accb16 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(196,227,28,.7));transition:filter .2s}
.r-core .lbl{position:absolute;left:0;right:0;bottom:46px;text-align:center;font:800 20px/1 var(--hud);letter-spacing:7px;padding-left:7px;color:var(--lime3)}
#stage.rand .r-core{box-shadow:inset 0 0 0 3px rgba(232,64,143,.95),inset 0 10px 30px rgba(0,0,0,.6),0 0 0 6px rgba(5,5,5,.9),0 0 40px rgba(232,64,143,.8)}
#stage.rand .r-core .q{background:linear-gradient(180deg,#ffffff 0%,#f7c6de 45%,#ec73aa 55%,#e8408f 100%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 14px rgba(232,64,143,.9));animation:flick .16s steps(2,end) infinite}
#stage.rand .r-core .lbl{color:#f7c6de}
.hubhit{width:360px;height:360px;pointer-events:auto;cursor:pointer}
@keyframes spinC{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes flick{50%{opacity:.55}}

/* ---------- cards (the roster) ---------- */
#cards{left:0;top:0;width:1920px;height:1080px;pointer-events:none;z-index:10}  /* own stacking layer: a raised card can't pass the fighter */
.card{position:absolute;left:0;top:0;width:132px;height:176px;margin:-88px 0 0 -66px;pointer-events:auto;cursor:pointer;
  transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(var(--s,1));transition:transform .18s cubic-bezier(.25,.9,.3,1),opacity .3s ease;will-change:transform;
  filter:drop-shadow(0 0 7px var(--g)) drop-shadow(0 8px 10px rgba(0,0,0,.5))}
.card .in{position:absolute;inset:0}
.card .face{position:absolute;inset:0;border-radius:10px;overflow:hidden;background:linear-gradient(172deg,#ffffff 0%,#fff7fb 60%,#ffe6f2 100%);box-shadow:inset 0 0 0 3px var(--pink2),inset 0 -14px 22px rgba(232,64,143,.10);transition:background .2s}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;-webkit-user-drag:none}
.card .gloss{position:absolute;inset:0;border-radius:10px;background:linear-gradient(180deg,rgba(255,255,255,.62) 0%,rgba(255,255,255,.14) 44%,transparent 45%);pointer-events:none;mix-blend-mode:screen}
.card .badge{position:absolute;left:-14px;top:-16px;padding:5px 11px 3px;border-radius:999px;font:900 italic 21px/1 var(--hud);color:#fff;background:linear-gradient(180deg,#f190c0 0%,#e8408f 48%,#c42a74 52%,#ee5aa0 100%);box-shadow:0 0 0 2px #fff,0 0 14px rgba(232,64,143,.9),inset 0 -2px 4px rgba(0,0,0,.25);opacity:0;transform:scale(.6) rotate(calc(var(--r) * -1));transition:opacity .15s,transform .2s cubic-bezier(.25,1.6,.4,1)}
.card.on{--s:1.24;z-index:40;filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 12px var(--c)) drop-shadow(0 0 30px var(--c))}
.card.on .face{background:linear-gradient(172deg,#ffffff 0%,color-mix(in srgb,var(--c) 30%,#fff) 58%,color-mix(in srgb,var(--c) 75%,#fff) 100%)}
.card.on .badge{opacity:1;transform:scale(1) rotate(calc(var(--r) * -1))}
#stage.roulette .card,#stage.roulette .card .badge{transition-duration:.05s}
#stage.locked .card:not(.on){opacity:.32;filter:grayscale(1) brightness(.75)}
.card.bump{animation:bump .22s ease}
@keyframes bump{25%{margin-left:-73px}50%{margin-left:-60px}75%{margin-left:-69px}}

/* ---------- READY band (behind the fighter, in front of the ring) ---------- */
#band{left:0;top:468px;width:1920px;height:214px;pointer-events:none;visibility:hidden;z-index:20}
#band .bg{position:absolute;inset:0;transform:scaleY(0);transition:transform .2s cubic-bezier(.2,.9,.3,1);
  background:linear-gradient(180deg,rgba(255,255,255,.45) 0%,rgba(255,255,255,.08) 48%,transparent 49%),linear-gradient(90deg,transparent 0,rgba(150,24,84,.92) 12%,#e8408f 52%,rgba(150,24,84,.92) 90%,transparent 100%);
  border-top:3px solid var(--chart);border-bottom:3px solid var(--chart);box-shadow:0 0 50px rgba(232,64,143,.55),0 0 24px rgba(196,227,28,.35)}
#band .bg::after{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.22) 1.5px,transparent 2px);background-size:10px 10px}
#band .txt{position:absolute;left:1330px;top:22px;transform:translateX(-50%) skewX(-10deg);font:400 150px/1 var(--title);letter-spacing:18px;white-space:nowrap;display:flex}
#band .txt span{display:inline-block;background:linear-gradient(180deg,#ffffff 0%,#ffffff 40%,#f3f9c8 52%,#c4e31c 60%,#ffffff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 1px #5e0f33) drop-shadow(4px 5px 0 #6e1440) drop-shadow(0 0 18px rgba(196,227,28,.6));opacity:0;transform:translateX(180px)}
#band .sub{position:absolute;left:1330px;bottom:14px;transform:translateX(-50%);font:800 30px/1 var(--hud);letter-spacing:11px;color:#fff;white-space:nowrap;opacity:0;text-shadow:0 2px 0 #6e1440,0 0 10px rgba(255,255,255,.5)}
#band .shine{position:absolute;inset:0;background:linear-gradient(100deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);background-size:300% 100%;background-position:120% 0;opacity:0}
#stage.locked #band{visibility:visible}
#stage.locked #band .bg{transform:scaleY(1)}
#stage.locked #band .txt span{animation:letterIn .36s cubic-bezier(.2,.9,.3,1) forwards;animation-delay:calc(var(--i) * 45ms + 120ms)}
#stage.locked #band .sub{animation:appear .3s .5s forwards}
#stage.locked #band .shine{animation:shine .7s .55s ease-out forwards}
@keyframes letterIn{to{opacity:1;transform:none}}
@keyframes appear{from{opacity:0}to{opacity:1}}
@keyframes shine{0%{opacity:1;background-position:120% 0}100%{opacity:1;background-position:-20% 0}}

/* ---------- the fighter (left) ---------- */
#hero,#heroBack{left:0;top:0;width:1920px;height:1080px;pointer-events:none}
#hero{z-index:30}
#vstrip,#topbar,#ptag,#nameplate{z-index:40}
#swoosh{left:0;top:60px;width:980px;height:1020px;opacity:.9}
#heroNum{position:absolute;left:600px;top:84px;font:400 300px/1 var(--title);color:transparent;-webkit-text-stroke:2px color-mix(in srgb,var(--c) 80%,#fff);opacity:.26;letter-spacing:-4px}
#spot{left:250px;top:990px;width:460px;height:84px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--c) 70%,#fff) 0%,color-mix(in srgb,var(--c) 40%,transparent) 45%,transparent 100%);opacity:.75;filter:blur(2px)}
#spot::after{content:"";position:absolute;inset:18px 40px;border-radius:50%;border:2px solid color-mix(in srgb,var(--c) 60%,#fff);opacity:.55}
#fig{left:0;top:0;width:1920px;height:1080px;transform-origin:480px 1032px;filter:drop-shadow(0 0 1.8px rgba(255,255,255,.95)) drop-shadow(0 0 16px var(--c))}
#fig .fm{position:absolute;display:block;opacity:0;object-fit:fill;pointer-events:none}
#randImg{position:absolute;opacity:0;filter:grayscale(1) brightness(.45) contrast(1.4)}
#hero .q{position:absolute;left:140px;top:150px;width:700px;text-align:center;font:400 600px/1 var(--title);color:transparent;-webkit-text-stroke:3px rgba(236,115,170,.35);display:none}
#hero.rand .q{display:block;animation:flick2 .16s steps(2,end) infinite}
#hero.rand #randImg{opacity:1}
@keyframes flick2{50%{opacity:.4;transform:translateX(6px)}}

/* ---------- frame + HUD ---------- */
#vstrip{left:0;top:72px;width:44px;height:1008px;background:linear-gradient(90deg,#050505,#191918 55%,#0a0a09);border-right:1px solid rgba(196,227,28,.35);box-shadow:2px 0 14px rgba(0,0,0,.5);overflow:hidden}
#vstrip div{writing-mode:vertical-rl;transform:rotate(180deg);font:700 19px/44px var(--hud);letter-spacing:8px;color:rgba(196,227,28,.6);white-space:nowrap;animation:vscroll 30s linear infinite}
@keyframes vscroll{from{translate:0 0}to{translate:0 -50%}}
#topbar{left:0;top:0;width:1920px;height:72px;box-sizing:border-box;padding:0 46px 0 70px;display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(180deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.04) 48%,transparent 50%),linear-gradient(180deg,#2a2a28 0%,#121211 55%,#050505 100%);
  border-bottom:2px solid rgba(196,227,28,.75);box-shadow:0 0 18px rgba(196,227,28,.35),0 8px 24px rgba(0,0,0,.6)}
#topbar::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:3px;background:linear-gradient(90deg,transparent,var(--pink) 20%,var(--pink2) 50%,var(--pink) 80%,transparent);box-shadow:0 0 12px rgba(232,64,143,.8)}
.hdr{font:900 italic 34px/1 var(--hud);letter-spacing:3px;background:linear-gradient(180deg,#ffffff 0%,#f3f9c8 45%,#c4e31c 55%,#accb16 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #000) drop-shadow(0 0 10px rgba(196,227,28,.5))}
#titlePlate{position:absolute;left:50%;top:7px;height:58px;padding:0 54px;transform:translateX(-50%);display:grid;place-items:center;border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.35) 0%,rgba(255,255,255,.06) 48%,transparent 50%),linear-gradient(180deg,#f070ad 0%,#e8408f 50%,#b8226a 100%);
  box-shadow:0 0 0 2px #fff,0 0 0 4px rgba(232,64,143,.6),0 0 24px rgba(232,64,143,.8),inset 0 -3px 8px rgba(0,0,0,.25)}
#titlePlate span{font:400 34px/1 var(--title);letter-spacing:10px;padding-left:10px;color:#fff;text-shadow:0 2px 0 #7a1748,0 0 12px rgba(255,255,255,.6)}
#hints{display:flex;gap:22px;align-items:center;font:700 19px/1 var(--hud);letter-spacing:2px;color:var(--lime3);transition:opacity .3s ease}
#hints kbd{display:inline-block;font:800 17px/1 var(--hud);padding:6px 10px 4px;margin-right:7px;color:var(--ink);border-radius:7px;
  background:linear-gradient(180deg,#ffffff 0%,#f8fbe0 45%,#dcef7a 55%,#c4e31c 100%);box-shadow:0 0 0 1px rgba(255,255,255,.9),0 0 10px rgba(196,227,28,.6),inset 0 -2px 3px rgba(0,0,0,.2)}
#stage.nohints #hints{opacity:0}
#ptag{left:72px;top:92px;display:flex;align-items:center;height:42px;border-radius:999px;overflow:hidden;box-shadow:0 0 0 2px #fff,0 0 16px rgba(232,64,143,.7);font:900 italic 25px/1 var(--hud);letter-spacing:4px}
#ptag span{padding:10px 14px 8px 20px;color:var(--ink);background:linear-gradient(180deg,#ffffff 0%,#f8fbe0 48%,#dcef7a 52%,#c4e31c 100%)}
#ptag b{padding:10px 18px 8px 14px;color:#fff;background:linear-gradient(180deg,#f190c0 0%,#e8408f 48%,#c42a74 52%,#ee5aa0 100%);font-weight:900}
#nameplate{left:86px;bottom:40px;display:flex;flex-direction:column;gap:6px;pointer-events:none;isolation:isolate}
#nameplate::before{content:"";position:absolute;z-index:-1;left:-46px;right:-200px;top:-30px;bottom:-30px;background:linear-gradient(90deg,rgba(8,8,7,.88),rgba(8,8,7,.52) 55%,transparent)}
#np-epi{display:flex;gap:16px;align-items:baseline;font:800 28px/1 var(--hud);letter-spacing:8px;text-transform:uppercase;color:color-mix(in srgb,var(--c) 85%,#fff);text-shadow:0 0 12px color-mix(in srgb,var(--c) 75%,transparent),0 2px 0 #000}
#np-epi i{font-style:normal;color:#fff;opacity:.8;font-variant-numeric:tabular-nums}
#np-name{font:900 italic 112px/1.02 var(--hud);white-space:nowrap;padding:0 44px 6px 4px;margin-right:-44px;letter-spacing:2px;transform:skewX(-6deg);transform-origin:0 100%;
  background:linear-gradient(180deg,#ffffff 0%,#ffffff 38%,color-mix(in srgb,var(--c) 30%,#fff) 50%,color-mix(in srgb,var(--c) 85%,#fff) 74%,#ffffff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 1px #000) drop-shadow(3px 4px 0 #000) drop-shadow(0 0 20px color-mix(in srgb,var(--c) 75%,transparent))}
#np-rule{height:5px;width:660px;border-radius:3px;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 40%,#fff) 40%,transparent);box-shadow:0 0 12px var(--c)}
#flash{z-index:50;left:0;top:0;width:1920px;height:1080px;background:radial-gradient(circle at 30% 55%,#fff 0%,#f7c6de 45%,#ec73aa 100%);opacity:0;pointer-events:none}

/* ---------- intro (press R to replay) ---------- */
@keyframes fadeIn{from{opacity:0}}
@keyframes hubIn{from{opacity:0;transform:rotate(-30deg) scale(.82)}}
@keyframes cardIn{from{opacity:0;transform:scale(.3) rotate(-40deg)}}
@keyframes dropIn{from{transform:translateY(-100%)}}
@keyframes heroIn{from{opacity:0;transform:translateX(-140px)}}
@keyframes wipeIn{from{clip-path:inset(-80px calc(100% + 80px) -80px -80px)}to{clip-path:inset(-80px -260px -80px -80px)}}
#stage.intro #bgCanvas{animation:fadeIn .5s both}
#stage.intro #hub{animation:hubIn 1s cubic-bezier(.2,.85,.25,1) both;transform-origin:540px 540px}
#stage.intro .card .in{animation:cardIn .42s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(var(--k) * 45ms + .45s)}
#stage.intro #topbar,#stage.intro #vstrip{animation:dropIn .5s cubic-bezier(.2,.9,.3,1) both}
#stage.intro #hero,#stage.intro #heroBack{animation:heroIn .7s .7s cubic-bezier(.2,.9,.3,1) both}
#stage.intro #nameplate{animation:wipeIn .5s 1s both}
#stage.intro #ptag{animation:fadeIn .4s 1.2s both}
@media (prefers-reduced-motion: reduce){
  .r-dash,.r-text,.spark,#vstrip div{animation:none!important}
  #stage.intro *{animation-duration:.01s!important;animation-delay:0s!important}
}
</style>
</head>
<body>
<div id="viewport">
<div id="stage" class="intro">
<div id="shaker">
  <canvas id="bgCanvas" class="layer" width="2880" height="1620"></canvas>
  <div id="glowRing" class="layer"></div>
  <div id="glowHero" class="layer"></div>
  <div id="sparks" class="layer" style="inset:0;pointer-events:none"></div>

  <div id="heroBack" class="layer">
    <svg id="swoosh" class="layer" viewBox="0 0 980 1020" aria-hidden="true">
      <defs>
        <linearGradient id="swP" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#e8408f" stop-opacity="0"/><stop offset=".35" stop-color="#e8408f" stop-opacity=".55"/><stop offset=".7" stop-color="#ec73aa" stop-opacity=".35"/><stop offset="1" stop-color="#f7c6de" stop-opacity="0"/></linearGradient>
        <linearGradient id="swL" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#c4e31c" stop-opacity="0"/><stop offset=".4" stop-color="#c4e31c" stop-opacity=".45"/><stop offset=".75" stop-color="#accb16" stop-opacity=".3"/><stop offset="1" stop-color="#accb16" stop-opacity="0"/></linearGradient>
        <linearGradient id="swW" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
      </defs>
      <path d="M-40 980 C 180 760, 360 520, 980 300 L 980 380 C 420 560, 230 800, 40 1020 Z" fill="url(#swP)"/>
      <path d="M-40 900 C 240 700, 420 420, 980 210 L 980 236 C 440 450, 250 720, -10 930 Z" fill="url(#swL)"/>
      <path d="M-30 960 C 200 750, 380 505, 980 292" fill="none" stroke="url(#swW)" stroke-width="2.5"/>
      <path d="M60 1020 C 260 820, 470 640, 980 470" fill="none" stroke="url(#swL)" stroke-width="10" stroke-linecap="round"/>
    </svg>
    <div id="heroNum">01</div>
    <div id="spot" class="layer"></div>
  </div>

  <div id="hub" class="layer">

<script>
/* =====================================================================

   ===================================================================== */
const CONFIG = {
  gameTitle:   'ALTER EGO',
  leftLabel:   'CHARACTER SELECT',
  playerLabel: 'PLAYER',
  readyText:   'READY',
  randomName:  'RANDOM',
  randomTag:   'Fate decides',
  epithet:     'Alter Ego',   // shown above the name when a fighter has none
  startWith:   0,             // roster index the cursor starts on
  showHints:   true,          // H toggles them (for recording)
  floorX: 480, floorY: 1032,  // where every fighter's feet stand, stage px

  // roster.js has the green poster's glow colours; this page swaps them for the Alter Egos poster's limes and pinks
  recolour: { '#ff2e93': '#e8408f', '#f93193': '#f0509e', '#ff7ac1': '#ec73aa', '#8bf26f': '#c4e31c', '#d7ff3c': '#d8f03a', '#19bf73': '#accb16' },

/* ===================================================================== */

(() => {
const $ = s => document.querySelector(s);
const D2R = Math.PI / 180;
const MEDIA = window.ALTER_EGO_MEDIA;

}
const STORE = MEDIA.store;
const ROSTER = MEDIA.fighters.map(f => Object.assign({}, f, { colour: CONFIG.recolour[String(f.colour).toLowerCase()] || f.colour }, CONFIG.fighters[f.name] || {}));
const N = ROSTER.length, RANDOM = 99;
const stage = $('#stage'), shaker = $('#shaker'), hero = $('#hero'), fig = $('#fig'), randImg = $('#randImg');
const attr = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');

// Safari plays HEVC with alpha (.mov); everything else plays VP9 with alpha (.webm)

/* ---------------- static text ---------------- */
$('#hdrLeft').textContent = CONFIG.leftLabel;

/* ---------------- background: the Alter Egos poster's collage, laid round this layout (drawn once) ---------------- */
// seeded random, so the collage is the same every time

function drawBackground() {
  const cv = $('#bgCanvas'), K = cv.width / 1920, g = cv.getContext('2d'), R = rng(2027);
  const H = { x: 1330, y: 575 };   // the ring's centre (#hub)
  const rnd = (a, b) => a + (b - a) * R();
  const C = { ink: '#0a0a09', lime: '#accb16', lime2: '#c4e31c', olive: '#4c5c15', olive2: '#748617', pink: '#ec73aa', hot: '#e8408f', pinkd: '#b8527a', grey: '#35302f', grey2: '#5e564a', dark: '#1b1918' };

  const blob = (x, y, r, col, n = 14, rough = .35) => { g.fillStyle = col; g.beginPath();
    for (let i = 0; i <= n; i++) { const a = i / n * Math.PI * 2, rr = r * (1 + rough * (R() - .5)); i ? g.lineTo(x + rr * Math.cos(a), y + rr * Math.sin(a)) : g.moveTo(x + rr * Math.cos(a), y + rr * Math.sin(a)); }
    g.closePath(); g.fill(); };
  const dot = (x, y, r, col) => { g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); };
  const splat = (x, y, r, col, drops = 26, reach = 2.2) => {

      dot(x + (d + rnd(6, 30)) * Math.cos(a), y + (d + rnd(6, 30)) * Math.sin(a), rnd(2, w * .8 + 2), col); }
  };
  const ring = (x, y, r, w, col, a0 = 0, a1 = Math.PI * 2) => { g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'butt'; g.beginPath(); g.arc(x, y, r, a0, a1); g.stroke(); };
  const swirl = (x, y, r, turns, w, col, a0 = 0, dir = 1) => {   // tapered spiral curl

    dot(x, y, r * .22, C.ink); };

  const rrect = (x, y, w, h, rad, ang, col) => { g.save(); g.translate(x, y); g.rotate(ang); g.fillStyle = col; g.beginPath(); g.roundRect(-w / 2, -h / 2, w, h, rad); g.fill(); g.restore(); };
  const curve = (pts, w, col) => { g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round'; g.beginPath(); g.moveTo(pts[0], pts[1]); g.bezierCurveTo(...pts.slice(2)); g.stroke(); };

  // dark grunge underneath
  for (let i = 0; i < 22; i++) splat(rnd(0, 1920), rnd(0, 1080), rnd(30, 90), i % 3 ? C.dark : '#24211f', 14, 2.6);
  // olive rings and circles (left, behind the player tag; bottom right), olive bars top right, grey rings
  ring(250, 260, 150, 28, C.olive); ring(250, 260, 104, 10, 'rgba(116,134,23,.6)');
  dot(860, 170, 46, C.olive); dot(860, 170, 23, C.ink);
  ring(1830, 970, 110, 22, C.olive); dot(1690, 1050, 38, 'rgba(116,134,23,.8)');
  for (let i = 0; i < 10; i++) { g.fillStyle = i % 2 ? C.olive : C.olive2; g.fillRect(rnd(1690, 1910), rnd(40, 110), rnd(6, 20), rnd(160, 380)); }
  ring(1840, 200, 84, 22, C.grey); ring(1760, 480, 52, 14, C.grey2); ring(960, 1010, 60, 14, C.grey);
  dot(1880, 650, 30, C.grey); ring(120, 770, 64, 14, C.grey);
  // translucent pink slabs behind the ring
  rrect(960, 700, 240, 420, 30, .3, 'rgba(236,115,170,.40)');
  rrect(1720, 300, 190, 290, 26, -.25, 'rgba(184,82,122,.5)');
  rrect(1730, 860, 200, 260, 24, .2, 'rgba(236,115,170,.30)');
  rrect(800, 260, 150, 240, 22, -.35, 'rgba(184,82,122,.4)');
  // lime and olive rays rising from the ring behind the cards
  for (let i = 0; i < 38; i++) {
    const a = rnd(226, 318) * D2R, r0 = rnd(320, 400), r1 = rnd(640, 1000), w = rnd(4, 28);
    g.strokeStyle = i % 4 === 0 ? C.olive2 : i % 3 === 0 ? C.olive : (i % 2 ? C.lime : C.lime2); g.globalAlpha = rnd(.75, 1); g.lineWidth = w; g.lineCap = 'butt';
    g.beginPath(); g.moveTo(H.x + r0 * Math.cos(a), H.y + r0 * Math.sin(a)); g.lineTo(H.x + r1 * Math.cos(a), H.y + r1 * Math.sin(a)); g.stroke();
    if (R() < .4) { g.lineCap = 'round'; g.lineWidth = w * .6; const rr = r1 + rnd(20, 60); g.beginPath(); g.moveTo(H.x + (r1 + 8) * Math.cos(a), H.y + (r1 + 8) * Math.sin(a)); g.lineTo(H.x + rr * Math.cos(a), H.y + rr * Math.sin(a)); g.stroke(); }
  }
  g.globalAlpha = 1;
  // the lime oval halftone, in arcs round the ring on the left (behind the fighter)
  g.fillStyle = C.lime;
  for (let r = 680; r <= 1160; r += 40) {
    const step = (24 + r * .045) / r;
    for (let a = 146 * D2R; a <= 214 * D2R; a += step) {
      const x = H.x + r * Math.cos(a), y = H.y + r * Math.sin(a);
      if (x < -30 || y < -30 || y > 1110) continue;

      g.save(); g.translate(x, y); g.rotate(a + Math.PI / 2); g.beginPath(); g.ellipse(0, 0, rx, ry, 0, 0, 7); g.fill(); g.restore();
    }
  }

  ring(H.x, H.y, 562, 10, 'rgba(232,64,143,.75)', 2.15, 4.15);
  ring(H.x, H.y, 614, 4, 'rgba(236,115,170,.6)', 1.95, 4.35);
  swirl(880, 300, 56, 2.1, 12, C.pink, 0, 1); swirl(1020, 960, 60, 2, 12, C.hot, 3, 1);
  swirl(1860, 760, 50, 1.9, 10, C.pinkd, 0, 1); swirl(1580, 1010, 46, 1.9, 9, C.pink, 4, -1);
  swirl(150, 520, 48, 2, 10, C.pink, 2, -1); swirl(1890, 360, 40, 1.8, 8, C.hot, 1, 1);
  curve([60, 640, 160, 500, 330, 560, 420, 430], 8, C.pink);
  curve([1100, 1070, 1300, 990, 1500, 1060, 1700, 1000], 8, C.pink);
  curve([700, 100, 820, 180, 900, 110, 1020, 190], 6, C.hot);
  flower(1030, 860, 26, C.pink, 6, .3); flower(1070, 810, 18, C.pink, 6, 1); flower(1660, 1010, 22, C.pinkd, 6, .5); flower(1880, 560, 20, C.pink, 5, .2);
  for (const [x, y, l, a] of [[1010, 900, 44, -.6], [1050, 840, 36, -1.4], [1690, 1030, 40, .7], [760, 330, 44, -2.2], [700, 380, 34, -.8], [1870, 600, 40, 2.4], [120, 580, 36, 1.9]]) leaf(x, y, l, a, R() < .5 ? C.lime : C.olive2);
  // pink paint marks, lime flecks
  splat(700, 150, 18, C.pink, 10, 2.2); splat(1880, 100, 16, C.pink, 8, 2.4);
  splat(1010, 520, 12, C.lime2, 10, 3); splat(1620, 1050, 12, C.lime2, 10, 3);
  // the lime splash the ring sits in, with black specks
  splat(H.x, H.y, 150, C.lime, 46, 2.5);   // mostly under the core, so the RANDOM SELECT text keeps a dark ring
  for (let i = 0; i < 14; i++) { const a = rnd(0, Math.PI * 2), d = rnd(220, 380); dot(H.x + d * Math.cos(a), H.y + d * Math.sin(a), rnd(4, 14), C.ink); }
  // grain over everything

}
drawBackground();

// sparkles
const STAR = 'M17 0 C18.4 11 23 15.6 34 17 C23 18.4 18.4 23 17 34 C15.6 23 11 18.4 0 17 C11 15.6 15.6 11 17 0 Z';
$('#sparks').innerHTML = [[930, 130, '#c4e31c', 2.8, 0], [1840, 300, '#ec73aa', 3.4, .6], [1770, 820, '#c4e31c', 3, 1.2], [880, 980, '#ec73aa', 2.6, .3],
  [130, 300, '#ec73aa', 3.2, 1.6], [760, 560, '#c4e31c', 2.4, 2], [1600, 120, '#ffffff', 3.6, .9], [380, 820, '#c4e31c', 3.1, 1.1], [1890, 620, '#ffffff', 2.9, 2.2]]
  .map(([x, y, c, t, d]) => `<svg class="spark" viewBox="0 0 34 34" style="left:${x}px;top:${y}px;--sc:${c};--t:${t}s;--d:${d}s"><path d="${STAR}"/></svg>`).join('');

/* ---------------- cards around the ring ---------------- */
const RC = { x: 1330, y: 575 }, RCARD = 380;
const POS = new Map();
const cardsEl = $('#cards');
let html = '';
ROSTER.forEach((f, k) => {
  const a = (-90 + k * 360 / N) * D2R;
  const x = RC.x + RCARD * Math.cos(a), y = RC.y + RCARD * Math.sin(a);
  const jitter = ((k * 37) % 11 - 5) * 1.1;
  const r = -30 * Math.sin(2 * a) + jitter;
  POS.set(k, [x - RC.x, y - RC.y]);
  const glow = k % 2 ? 'rgba(236,115,170,.75)' : 'rgba(196,227,28,.7)';
  html += `<div class="card" data-k="${k}" style="--x:${x.toFixed(1)}px;--y:${y.toFixed(1)}px;--r:${r.toFixed(1)}deg;--g:${glow};--k:${k}">
    <div class="in"><div class="face"><img src="media/${attr(f.dir)}/card_color.webp" alt="${attr(f.name)}" draggable="false"></div><div class="gloss"></div><div class="badge">1P</div></div></div>`;
});
cardsEl.innerHTML = html;
POS.set(RANDOM, [0, 0]);
const cardEls = [...cardsEl.querySelectorAll('.card')];
const badgeEls = cardEls.map(el => el.querySelector('.badge'));
// black silhouettes (card_color); the plain dark green card if the build hasn't made them
cardEls.forEach(el => { const im = el.querySelector('img'); im.onerror = () => { im.onerror = null; im.src = im.src.replace('card_color', 'card'); }; });

/* ---------------- fighter media (poster + idle loop + selected move) ---------------- */
function place(el, m) {
  const lift = m.lying ? CONFIG.lyingLift : 0;   // a lying figure would hide behind the nameplate
  el.style.width = (m.w / STORE).toFixed(1) + 'px';
  el.style.height = (m.h / STORE).toFixed(1) + 'px';
  el.style.left = (CONFIG.floorX - (m.lying ? m.w / 2 : m.ax) / STORE).toFixed(1) + 'px';
  el.style.top = (CONFIG.floorY - lift - m.ay / STORE).toFixed(1) + 'px';
}
function video(src, loop) {
  const v = document.createElement('video');
  v.muted = true; v.defaultMuted = true; v.playsInline = true; v.loop = loop; v.className = 'fm';
  v.setAttribute('muted', ''); v.setAttribute('playsinline', '');
  v.preload = loop ? 'auto' : 'none';
  v.src = src;
  return v;
}
const media = [];
let shown = -1;
function mediaFor(k) {
  if (media[k]) return media[k];
  const f = ROSTER[k], base = `media/${f.dir}/`;
  const poster = new Image(); poster.className = 'fm'; poster.alt = ''; poster.src = base + 'poster.webp';
  const idle = video(base + 'idle.' + EXT, true), sel = video(base + 'selected.' + EXT, false);
  place(poster, f.idle); place(idle, f.idle); place(sel, f.selected);
  fig.append(poster, idle, sel);
  const m = media[k] = { poster, idle, sel, idleOK: false, selLoading: false };
  idle.addEventListener('playing', () => { m.idleOK = true; if (shown === k && !(locked && m.selOn)) layer(m, 'idle'); });
  sel.addEventListener('playing', () => { if (shown === k && locked) { m.selOn = true; layer(m, 'sel'); } });
  return m;
}
function layer(m, which) {
  m.poster.style.opacity = which === 'poster' ? 1 : 0;
  m.idle.style.opacity = which === 'idle' ? 1 : 0;
  m.sel.style.opacity = which === 'sel' ? 1 : 0;
}
function hideFighter() {
  if (shown >= 0 && media[shown]) { const m = media[shown]; layer(m, 'none'); m.idle.pause(); m.sel.pause(); m.selOn = false; }
  shown = -1;
}
let selT = null;
function showFighter(k, fast) {
  if (shown !== k) hideFighter();
  shown = k;
  const m = mediaFor(k);
  clearTimeout(selT);
  if (fast) { layer(m, 'poster'); return; }
  layer(m, m.idleOK ? 'idle' : 'poster');
  m.idle.play().catch(() => {});
  // start fetching the selected move once the cursor rests here
  selT = setTimeout(() => { if (!m.selLoading) { m.selLoading = true; m.sel.preload = 'auto'; m.sel.load(); } }, 180);
}
function playSelected(k) {
  const m = mediaFor(k);
  shown = k;
  if (!m.selLoading) { m.selLoading = true; m.sel.preload = 'auto'; }
  m.selOn = false;
  m.sel.currentTime = 0;
  m.sel.play().catch(() => {});
  m.idle.pause();
}
function backToIdle(k) {
  const m = media[k]; if (!m) return;
  m.sel.pause(); m.selOn = false;
  layer(m, m.idleOK ? 'idle' : 'poster');
  m.idle.play().catch(() => {});
}

/* ---------------- state ---------------- */
let cur = null, locked = false, busy = false, randTimer = null;

function fitName() {
  const el = $('#np-name');
  el.style.fontSize = '112px';
  const w = el.scrollWidth, max = 860;
  if (w > max) el.style.fontSize = (112 * max / w).toFixed(1) + 'px';
}
function setPlate(no, epithet, name, anim) {
  $('#np-no').textContent = no;
  $('#np-epithet').textContent = epithet;
  $('#np-name').textContent = name;
  fitName();
  if (anim) $('#nameplate').animate([{ clipPath: 'inset(-80px calc(100% + 80px) -80px -80px)' }, { clipPath: 'inset(-80px -260px -80px -80px)' }], { duration: anim === 'fast' ? 80 : 240, easing: 'ease-out' });
}
function select(s, mode = 'normal') {
  if (s === cur) return;
  cur = s;
  cardEls.forEach((el, k) => el.classList.toggle('on', k === s));
  const isRand = s === RANDOM;
  stage.classList.toggle('rand', isRand);
  hero.classList.toggle('rand', isRand);
  clearInterval(randTimer);
  if (isRand) {
    hideFighter();
    stage.style.setProperty('--c', '#e8408f');
    $('#heroNum').textContent = '??';
    setPlate('No.??', CONFIG.randomTag, CONFIG.randomName, mode !== 'none' && mode);
    const tick = () => { const f = ROSTER[(Math.random() * N) | 0]; randImg.src = `media/${f.dir}/poster.webp`; place(randImg, f.idle); };
    tick(); randTimer = setInterval(tick, 85);
    return;
  }
  const f = ROSTER[s], no = String(f.no || s + 1).padStart(2, '0');
  stage.style.setProperty('--c', f.colour);
  $('#heroNum').textContent = no;
  setPlate('No.' + no, f.epithet || CONFIG.epithet, f.name.toUpperCase(), mode !== 'none' && mode);
  showFighter(s, mode === 'fast');
  if (mode !== 'none') fig.animate([{ opacity: 0, transform: 'translateX(-60px)' }, { opacity: 1, transform: 'none' }], { duration: mode === 'fast' ? 90 : 240, easing: 'cubic-bezier(.2,.85,.25,1)' });
}
function bump() {
  const el = cardEls[cur] || null;
  if (!el) return;
  el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
}
function nav(dx, dy) {
  if (locked || busy) return;
  const [x0, y0] = POS.get(cur);
  let best = null, bs = Infinity, by = 0;
  for (const [k, [x, y]] of POS) {
    if (k === cur) continue;
    const vx = x - x0, vy = y - y0, d = Math.hypot(vx, vy), cos = (vx * dx + vy * dy) / d;
    if (cos < .3) continue;
    const sc = d * (1 + 2 * (1 - cos));
    if (sc < bs - .5 || (Math.abs(sc - bs) <= .5 && y < by)) { bs = sc; best = k; by = y; }
  }
  if (best === null) bump(); else select(best);
}
function lock(k) {
  locked = true;
  stage.classList.add('locked');
  $('#band .sub').textContent = `${CONFIG.playerLabel} 1 · ${ROSTER[k].name.toUpperCase()}`;
  badgeEls[k].textContent = 'OK';
  playSelected(k);
  $('#flash').animate([{ opacity: .9 }, { opacity: 0 }], { duration: 480, easing: 'ease-out' });
  shaker.animate([{ transform: 'translate(0,0)' }, { transform: 'translate(-12px,7px)' }, { transform: 'translate(10px,-6px)' }, { transform: 'translate(-7px,4px)' }, { transform: 'translate(4px,-2px)' }, { transform: 'translate(0,0)' }], { duration: 340, easing: 'ease-out' });
  fig.animate([{ transform: 'scale(1.06)' }, { transform: 'scale(1)' }], { duration: 380, easing: 'cubic-bezier(.2,.9,.3,1)' });
  cardEls[k].animate([{ filter: 'brightness(2)' }, { filter: 'brightness(1)' }], { duration: 500 });
}
function cancel() {
  if (!locked) return;
  locked = false;
  stage.classList.remove('locked');
  badgeEls.forEach(b => b.textContent = '1P');
  if (cur !== RANDOM && cur !== null) backToIdle(cur);
}
function confirmSel() {
  if (locked || busy || cur === null) return;
  if (cur === RANDOM) roulette(); else lock(cur);
}
function roulette() {
  busy = true;
  stage.classList.add('roulette');
  clearInterval(randTimer);
  const target = (Math.random() * N) | 0;
  let idx = (Math.random() * N) | 0;
  const path = [];
  for (;;) { idx = (idx + 1) % N; path.push(idx); if (path.length >= N && idx === target) break; }
  let t = 0;
  path.forEach((s, j) => { const p = j / (path.length - 1); t += 30 + 170 * p * p * p; setTimeout(() => select(s, 'fast'), t); });
  setTimeout(() => { busy = false; stage.classList.remove('roulette'); lock(target); }, t + 300);
}

/* ---------------- input ---------------- */
let hoverT = null;   // the pointer rests 60 ms on a card before it's picked, so sweeping across doesn't flicker
cardEls.forEach((el, k) => {
  el.addEventListener('pointerenter', () => { clearTimeout(hoverT); hoverT = setTimeout(() => { if (!locked && !busy) select(k); }, 60); });
  el.addEventListener('pointerleave', () => clearTimeout(hoverT));
  el.addEventListener('click', () => { clearTimeout(hoverT); if (locked || busy) return; select(k); confirmSel(); });
});
const hubHit = $('.hubhit');
hubHit.addEventListener('pointerenter', () => { if (!locked && !busy) select(RANDOM); });
hubHit.addEventListener('click', () => { if (locked || busy) return; select(RANDOM); confirmSel(); });
stage.addEventListener('contextmenu', e => { e.preventDefault(); cancel(); });

const DIRS = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
addEventListener('keydown', e => {
  const k = e.key;
  if (DIRS[k]) { e.preventDefault(); nav(...DIRS[k]); return; }
  if (k === 'Enter' || k === ' ' || k === 'z' || k === 'Z') { e.preventDefault(); if (!e.repeat) confirmSel(); return; }
  if (k === 'Escape' || k === 'Backspace' || k === 'x' || k === 'X') { e.preventDefault(); cancel(); return; }
  if (e.repeat) return;
  if (k === 'h' || k === 'H') stage.classList.toggle('nohints');
  else if (k === 'r' || k === 'R') replay();
  else if (k === 'f' || k === 'F') {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else document.documentElement.requestFullscreen?.().catch(() => {});
  }
});

// hide the mouse pointer when idle so it stays out of a screen recording
const vp = $('#viewport');
let idleT;
addEventListener('pointermove', () => { vp.classList.remove('nocursor'); clearTimeout(idleT); idleT = setTimeout(() => vp.classList.add('nocursor'), 1500); });

function replay() {
  if (busy) return;
  cancel();
  stage.classList.remove('intro'); void stage.offsetWidth; stage.classList.add('intro');
}

/* ---------------- scale to window ---------------- */
function fit() {
  const s = Math.min(vp.clientWidth / 1920, vp.clientHeight / 1080);
  stage.style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener('resize', fit);
fit();

// ?start=gwen or ?start=7 opens on that fighter (handy for recordings)
const q = new URLSearchParams(location.search).get('start');
let start = CONFIG.startWith | 0;
if (q) start = isNaN(+q) ? ROSTER.findIndex(f => f.name.toLowerCase() === q.toLowerCase()) : +q - 1;
select(Math.min(Math.max(start, 0), N - 1), 'none');
document.fonts && document.fonts.ready.then(fitName);
// warm every fighter's idle loop in the background, one at a time, after the intro
ROSTER.forEach((_, k) => setTimeout(() => mediaFor(k), 1600 + k * 300));
window.ALTER_EGO = { select, lock, cancel, roster: ROSTER, ext: EXT };
})();
</script>
</body>
